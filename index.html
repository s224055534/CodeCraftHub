<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #A78BFA;
        --primary-50: #F5F3FF;
        --primary-100: #EDE9FE;
        --success: #F59E0B;
        --success-dark: #D97706;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --gray-50: #F9FAFB;
        --gray-100: #F3F4F6;
        --gray-200: #E5E7EB;
        --gray-300: #D1D5DB;
        --gray-400: #9CA3AF;
        --gray-500: #6B7280;
        --gray-600: #4B5563;
        --gray-700: #374151;
        --gray-800: #1F2937;
        --gray-900: #111827;
        --white: #FFFFFF;
        --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
        --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
        --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        --radius: 12px;
        --radius-sm: 8px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, var(--primary-50) 0%, #FEF3C7 100%);
        color: var(--gray-800);
        min-height: 100vh;
        line-height: 1.5;
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--white);
        padding: 2.5rem 1.5rem;
        text-align: center;
        box-shadow: var(--shadow-lg);
      }
      .header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .header p {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        opacity: 0.85;
      }

      /* Container */
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      /* Section titles */
      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--gray-800);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .section-title .icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--primary-100);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
      }

      /* Card */
      .card {
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 1.5rem;
        margin-bottom: 2rem;
      }

      /* Form */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .form-group.full { grid-column: 1 / -1; }
      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gray-700);
      }
      .form-group label .req { color: var(--danger); }
      .form-group input,
      .form-group textarea,
      .form-group select {
        padding: 0.6rem 0.75rem;
        border: 2px solid var(--gray-200);
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-family: inherit;
        color: var(--gray-800);
        background: var(--white);
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
      }
      .form-group input.error,
      .form-group textarea.error,
      .form-group select.error {
        border-color: var(--danger);
      }
      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 1.25rem;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-primary {
        background: var(--primary);
        color: var(--white);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .btn-success {
        background: var(--success);
        color: var(--white);
      }
      .btn-success:hover:not(:disabled) {
        background: var(--success-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .btn-danger {
        background: var(--danger);
        color: var(--white);
      }
      .btn-danger:hover:not(:disabled) {
        background: var(--danger-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .btn-ghost {
        background: var(--gray-100);
        color: var(--gray-700);
      }
      .btn-ghost:hover:not(:disabled) {
        background: var(--gray-200);
      }
      .form-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      /* Alerts */
      .alert {
        padding: 0.75rem 1rem;
        border-radius: var(--radius-sm);
        font-size: 0.88rem;
        font-weight: 500;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: slideIn 0.3s ease;
      }
      .alert-success {
        background: #FEF3C7;
        color: #92400E;
        border: 1px solid var(--success);
      }
      .alert-error {
        background: #FEE2E2;
        color: #991B1B;
        border: 1px solid var(--danger);
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Spinner */
      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255,255,255,0.3);
        border-top-color: var(--white);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .spinner-dark {
        border: 2.5px solid var(--gray-200);
        border-top-color: var(--primary);
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Loading overlay */
      .loading-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--gray-500);
      }
      .loading-state .spinner-dark {
        display: inline-block;
        width: 36px;
        height: 36px;
        margin-bottom: 1rem;
      }

      /* Course table */
      .table-wrap {
        overflow-x: auto;
        border-radius: var(--radius);
        border: 1px solid var(--gray-200);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      thead {
        background: var(--primary-50);
      }
      th {
        text-align: left;
        padding: 0.85rem 1rem;
        font-weight: 600;
        color: var(--primary-dark);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      td {
        padding: 1rem;
        border-top: 1px solid var(--gray-100);
        vertical-align: top;
      }
      tbody tr {
        transition: background 0.15s;
      }
      tbody tr:hover {
        background: var(--primary-50);
      }
      .course-name {
        font-weight: 600;
        color: var(--gray-800);
      }
      .course-desc {
        color: var(--gray-500);
        font-size: 0.83rem;
        max-width: 280px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .course-date {
        color: var(--gray-600);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .course-created {
        color: var(--gray-400);
        font-size: 0.8rem;
        white-space: nowrap;
      }

      /* Status badges */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.7rem;
        border-radius: 99px;
        font-size: 0.78rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .badge-not-started {
        background: var(--gray-100);
        color: var(--gray-600);
      }
      .badge-not-started::before { background: var(--gray-400); }
      .badge-in-progress {
        background: #FEF3C7;
        color: var(--success-dark);
      }
      .badge-in-progress::before { background: var(--success); }
      .badge-completed {
        background: #DCFCE7;
        color: #166534;
      }
      .badge-completed::before { background: #22C55E; }

      /* Row actions */
      .row-actions {
        display: flex;
        gap: 0.5rem;
      }
      .icon-btn {
        padding: 0.4rem 0.7rem;
        font-size: 0.8rem;
        border-radius: var(--radius-sm);
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }
      .icon-btn-edit {
        background: var(--primary-100);
        color: var(--primary-dark);
      }
      .icon-btn-edit:hover {
        background: var(--primary);
        color: var(--white);
      }
      .icon-btn-delete {
        background: #FEE2E2;
        color: var(--danger-dark);
      }
      .icon-btn-delete:hover {
        background: var(--danger);
        color: var(--white);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--gray-400);
      }
      .empty-state .emoji {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(17,24,39,0.5);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        backdrop-filter: blur(2px);
      }
      .modal-overlay.active {
        display: flex;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow-xl);
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
        animation: scaleIn 0.25s ease;
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .modal-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--gray-100);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-header h2 {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--gray-800);
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 1.4rem;
        color: var(--gray-400);
        cursor: pointer;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        transition: all 0.2s;
      }
      .modal-close:hover {
        background: var(--gray-100);
        color: var(--gray-600);
      }
      .modal-body { padding: 1.5rem; }
      .modal-body .form-grid { grid-template-columns: 1fr; }
      .modal-footer {
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--gray-100);
        display: flex;
        gap: 0.75rem;
        justify-content: flex-end;
      }

      /* Stats row */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 1.1rem 1.25rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--gray-100);
      }
      .stat-card .label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--gray-400);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stat-card .value {
        font-size: 1.6rem;
        font-weight: 700;
        margin-top: 0.25rem;
      }
      .stat-card.total .value { color: var(--primary); }
      .stat-card.not-started .value { color: var(--gray-500); }
      .stat-card.in-progress .value { color: var(--success-dark); }
      .stat-card.completed .value { color: #16A34A; }

      /* Responsive */
      @media (max-width: 700px) {
        .header h1 { font-size: 1.3rem; }
        .header { padding: 1.75rem 1rem; }
        .container { padding: 1.25rem 1rem 3rem; }
        .form-grid { grid-template-columns: 1fr; }
        .stats { grid-template-columns: repeat(2, 1fr); }
        .hide-mobile { display: none; }
        th, td { padding: 0.7rem 0.6rem; }
        .course-desc { max-width: 150px; }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>

    <header class="header">
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
      <p>Plan, track, and complete your learning journey</p>
    </header>

    <div class="container">
      <!-- Stats -->
      <div class="stats" id="stats">
        <div class="stat-card total">
          <div class="label">Total Courses</div>
          <div class="value" id="stat-total">0</div>
        </div>
        <div class="stat-card not-started">
          <div class="label">Not Started</div>
          <div class="value" id="stat-not-started">0</div>
        </div>
        <div class="stat-card in-progress">
          <div class="label">In Progress</div>
          <div class="value" id="stat-in-progress">0</div>
        </div>
        <div class="stat-card completed">
          <div class="label">Completed</div>
          <div class="value" id="stat-completed">0</div>
        </div>
      </div>

      <!-- Alert container -->
      <div id="alert-container"></div>

      <!-- Add Course Form -->
      <div class="card">
        <div class="section-title">
          <span class="icon">+</span>
          Add New Course
        </div>
        <form id="course-form" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="name">Course Name <span class="req">*</span></label>
              <input type="text" id="name" name="name" placeholder="e.g. React Fundamentals" />
            </div>
            <div class="form-group">
              <label for="target_date">Target Date <span class="req">*</span></label>
              <input type="date" id="target_date" name="target_date" />
            </div>
            <div class="form-group full">
              <label for="description">Description <span class="req">*</span></label>
              <textarea id="description" name="description" placeholder="Brief description of what you'll learn..."></textarea>
            </div>
            <div class="form-group">
              <label for="status">Status <span class="req">*</span></label>
              <select id="status" name="status">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">
                Add Course
              </button>
              <button type="reset" class="btn btn-ghost">Clear</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Course List -->
      <div class="section-title">
        <span class="icon">&#128218;</span>
        Your Courses
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div id="course-list">
          <div class="loading-state">
            <div class="spinner-dark spinner"></div>
            <p>Loading courses...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>Edit Course</h2>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="edit-form" novalidate>
            <input type="hidden" id="edit-id" />
            <div class="form-grid">
              <div class="form-group">
                <label for="edit-name">Course Name <span class="req">*</span></label>
                <input type="text" id="edit-name" />
              </div>
              <div class="form-group">
                <label for="edit-target_date">Target Date <span class="req">*</span></label>
                <input type="date" id="edit-target_date" />
              </div>
              <div class="form-group">
                <label for="edit-description">Description <span class="req">*</span></label>
                <textarea id="edit-description"></textarea>
              </div>
              <div class="form-group">
                <label for="edit-status">Status <span class="req">*</span></label>
                <select id="edit-status">
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-success" id="update-btn">Save Changes</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'http://localhost:5000/api/courses';

      // ── State ──────────────────────────────────────
      let courses = [];

      // ── DOM helpers ────────────────────────────────
      const $ = (id) => document.getElementById(id);
      const courseList = $('course-list');
      const alertContainer = $('alert-container');

      // ── Alert ──────────────────────────────────────
      function showAlert(message, type = 'success') {
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.innerHTML = `<span>${type === 'success' ? '&#10003;' : '&#9888;'}</span> ${escapeHtml(message)}`;
        alertContainer.appendChild(alert);
        setTimeout(() => {
          alert.style.opacity = '0';
          alert.style.transform = 'translateY(-10px)';
          alert.style.transition = 'all 0.3s';
          setTimeout(() => alert.remove(), 300);
        }, 3500);
      }

      // ── Escape HTML ────────────────────────────────
      function escapeHtml(str) {
        if (str == null) return '';
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
      }

      // ── Format date ────────────────────────────────
      function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        if (isNaN(d)) return escapeHtml(dateStr);
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      // ── Status badge class ─────────────────────────
      function statusBadgeClass(status) {
        switch (status) {
          case 'In Progress': return 'badge-in-progress';
          case 'Completed': return 'badge-completed';
          default: return 'badge-not-started';
        }
      }

      // ── Render courses ─────────────────────────────
      function renderCourses() {
        if (courses.length === 0) {
          courseList.innerHTML = `
            <div class="empty-state">
              <div class="emoji">&#128218;</div>
              <p>No courses yet. Add your first course above!</p>
            </div>`;
          updateStats();
          return;
        }

        courseList.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Course</th>
                  <th class="hide-mobile">Target Date</th>
                  <th>Status</th>
                  <th class="hide-mobile">Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${courses.map(c => `
                  <tr>
                    <td>
                      <div class="course-name">${escapeHtml(c.name)}</div>
                      <div class="course-desc">${escapeHtml(c.description)}</div>
                    </td>
                    <td class="course-date hide-mobile">${formatDate(c.target_date)}</td>
                    <td><span class="badge ${statusBadgeClass(c.status)}">${escapeHtml(c.status)}</span></td>
                    <td class="course-created hide-mobile">${formatDate(c.created_at)}</td>
                    <td>
                      <div class="row-actions">
                        <button class="icon-btn icon-btn-edit" onclick="openEditModal(${c.id})">Edit</button>
                        <button class="icon-btn icon-btn-delete" onclick="deleteCourse(${c.id})">Delete</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
        updateStats();
      }

      // ── Stats ──────────────────────────────────────
      function updateStats() {
        $('stat-total').textContent = courses.length;
        $('stat-not-started').textContent = courses.filter(c => c.status === 'Not Started').length;
        $('stat-in-progress').textContent = courses.filter(c => c.status === 'In Progress').length;
        $('stat-completed').textContent = courses.filter(c => c.status === 'Completed').length;
      }

      // ── Loading state ──────────────────────────────
      function showLoading() {
        courseList.innerHTML = `
          <div class="loading-state">
            <div class="spinner-dark spinner"></div>
            <p>Loading courses...</p>
          </div>`;
      }

      // ── Button loading state ───────────────────────
      function setBtnLoading(btn, loading, originalText) {
        if (loading) {
          btn.dataset.original = originalText || btn.textContent;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> ' + (btn.dataset.original);
        } else {
          btn.disabled = false;
          btn.textContent = btn.dataset.original || originalText;
        }
      }

      // ── Validation ─────────────────────────────────
      function validateForm(data) {
        const errors = [];
        if (!data.name || !data.name.trim()) errors.push('Course name is required');
        if (!data.description || !data.description.trim()) errors.push('Description is required');
        if (!data.target_date) errors.push('Target date is required');
        if (!data.status) errors.push('Status is required');
        return errors;
      }

      // ── Highlight fields ───────────────────────────
      function highlightErrors(fields) {
        fields.forEach(f => {
          const el = $(f.id);
          if (el) {
            if (f.hasError) el.classList.add('error');
            else el.classList.remove('error');
          }
        });
      }

      // ── API: GET all ───────────────────────────────
      async function fetchCourses() {
        showLoading();
        try {
          const res = await fetch(API_URL);
          if (!res.ok) throw new Error(`Failed to fetch courses (${res.status})`);
          const data = await res.json();
          courses = Array.isArray(data) ? data : (data.courses || []);
          renderCourses();
        } catch (err) {
          courseList.innerHTML = `
            <div class="empty-state">
              <div class="emoji">&#9888;</div>
              <p>Could not load courses. Make sure the API server is running.</p>
              <p style="font-size:0.8rem; margin-top:0.5rem; color: var(--danger);">${escapeHtml(err.message)}</p>
            </div>`;
          showAlert('Failed to load courses: ' + err.message, 'error');
        }
      }

      // ── API: POST create ───────────────────────────
      $('course-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
          name: $('name').value,
          description: $('description').value,
          target_date: $('target_date').value,
          status: $('status').value,
        };

        const errors = validateForm(data);
        highlightErrors([
          { id: 'name', hasError: !data.name.trim() },
          { id: 'description', hasError: !data.description.trim() },
          { id: 'target_date', hasError: !data.target_date },
          { id: 'status', hasError: !data.status },
        ]);

        if (errors.length > 0) {
          showAlert(errors[0], 'error');
          return;
        }

        const btn = $('submit-btn');
        setBtnLoading(btn, true, 'Add Course');
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.message || errBody.error || `Failed to create course (${res.status})`);
          }
          const created = await res.json();
          courses.push(created);
          renderCourses();
          showAlert('Course added successfully!', 'success');
          $('course-form').reset();
        } catch (err) {
          showAlert('Failed to add course: ' + err.message, 'error');
        } finally {
          setBtnLoading(btn, false);
        }
      });

      // ── Clear error highlights on input ────────────
      ['name', 'description', 'target_date', 'status'].forEach(id => {
        $(id).addEventListener('input', () => $(id).classList.remove('error'));
      });

      // ── Edit Modal ─────────────────────────────────
      window.openEditModal = function(id) {
        const course = courses.find(c => c.id === id || String(c.id) === String(id));
        if (!course) return;
        $('edit-id').value = course.id;
        $('edit-name').value = course.name || '';
        $('edit-description').value = course.description || '';
        $('edit-target_date').value = course.target_date ? course.target_date.split('T')[0] : '';
        $('edit-status').value = course.status || 'Not Started';
        $('edit-modal').classList.add('active');
      };

      window.closeModal = function() {
        $('edit-modal').classList.remove('active');
      };

      // Close modal on overlay click
      $('edit-modal').addEventListener('click', (e) => {
        if (e.target === $('edit-modal')) closeModal();
      });

      // Close modal on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      // ── API: PUT update ────────────────────────────
      $('update-btn').addEventListener('click', async () => {
        const id = $('edit-id').value;
        const data = {
          name: $('edit-name').value,
          description: $('edit-description').value,
          target_date: $('edit-target_date').value,
          status: $('edit-status').value,
        };

        const errors = validateForm(data);
        if (errors.length > 0) {
          showAlert(errors[0], 'error');
          return;
        }

        const btn = $('update-btn');
        setBtnLoading(btn, true, 'Save Changes');
        try {
          const res = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.message || errBody.error || `Failed to update course (${res.status})`);
          }
          const updated = await res.json();
          const idx = courses.findIndex(c => String(c.id) === String(id));
          if (idx !== -1) courses[idx] = updated;
          renderCourses();
          closeModal();
          showAlert('Course updated successfully!', 'success');
        } catch (err) {
          showAlert('Failed to update course: ' + err.message, 'error');
        } finally {
          setBtnLoading(btn, false);
        }
      });

      // ── API: DELETE ────────────────────────────────
      window.deleteCourse = async function(id) {
        if (!confirm('Are you sure you want to delete this course?')) return;
        try {
          const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
          if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.message || errBody.error || `Failed to delete course (${res.status})`);
          }
          courses = courses.filter(c => String(c.id) !== String(id));
          renderCourses();
          showAlert('Course deleted successfully!', 'success');
        } catch (err) {
          showAlert('Failed to delete course: ' + err.message, 'error');
        }
      };

      // ── Init ───────────────────────────────────────
      fetchCourses();
    </script>
  </body>
</html>
